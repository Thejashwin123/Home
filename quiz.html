<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Quiz | Edunova</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .quiz-page {
            max-width: 820px;
            padding-top: 76px;
            padding-bottom: 110px;
        }

        .quiz-level-menu {
            display: flex;
            gap: 14px;
            margin-top: 30px;
        }

        .quiz-level-card {
            flex: 1;
            min-width: 0;
            padding: 19px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--ink);
            background: var(--white);
            text-align: left;
            cursor: pointer;
        }

        .quiz-level-card:hover:not(:disabled),
        .quiz-level-card.current {
            border-color: var(--mint-deep);
            background: #e8f5f0;
        }

        .quiz-level-card:disabled {
            opacity: .48;
            cursor: not-allowed;
        }

        .quiz-level-card strong {
            display: block;
            font: 700 19px/1.1 "Space Grotesk", sans-serif;
        }

        .quiz-level-card span {
            display: block;
            margin-top: 6px;
            color: var(--muted);
            font-size: 11px;
        }

        .quiz-card {
            margin-top: 32px;
            padding: clamp(24px, 5vw, 44px);
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--white);
        }

        .quiz-card[hidden] {
            display: none;
        }

        .quiz-progress {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 28px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-levels {
            display: flex;
            gap: 7px;
            margin: -12px 0 25px;
        }

        .quiz-level {
            flex: 1;
            height: 5px;
            border-radius: 99px;
            background: var(--line);
        }

        .quiz-level.active,
        .quiz-level.complete {
            background: var(--mint-deep);
        }

        .quiz-question {
            margin: 0 0 26px;
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(23px, 4vw, 34px);
            line-height: 1.15;
        }

        .quiz-options {
            display: grid;
            gap: 11px;
        }

        .quiz-option {
            width: 100%;
            padding: 15px 17px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: var(--paper);
            text-align: left;
            font: inherit;
            cursor: pointer;
        }

        .quiz-option:hover,
        .quiz-option.selected {
            border-color: var(--mint-deep);
            background: #e8f5f0;
        }

        .quiz-option.correct {
            border-color: var(--mint-deep);
            background: #d8f2e8;
        }

        .quiz-option.incorrect {
            border-color: var(--coral);
            background: #fff0ec;
        }

        .quiz-feedback {
            min-height: 24px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        .quiz-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }

        .quiz-actions button {
            padding: 12px 18px;
            border: 0;
            border-radius: 8px;
            color: var(--ink);
            background: var(--mint);
            font: 700 13px inherit;
            cursor: pointer;
        }

        .quiz-actions button:hover {
            background: #9ddac9;
        }

        .quiz-actions button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .quiz-result {
            padding: 20px;
            border-radius: 10px;
            background: #edf7f3;
        }

        .quiz-result strong {
            display: block;
            margin-bottom: 6px;
            font: 700 25px/1.1 "Space Grotesk", sans-serif;
        }

        .certificate {
            position: relative;
            padding: clamp(28px, 6vw, 58px) clamp(20px, 7vw, 72px);
            border: 8px double #d6b86b;
            color: #443b75;
            background: #fffdf6;
            text-align: center;
            box-shadow: inset 0 0 0 3px #ead9a0;
        }

        .certificate-kicker {
            margin: 0 0 12px;
            color: #9a7840;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .certificate h2 {
            margin: 0;
            color: #55468d;
            font: 700 clamp(32px, 7vw, 66px)/1 Georgia, serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .certificate-subtitle {
            margin: 8px 0 26px;
            color: #806da9;
            font: 700 clamp(14px, 3vw, 22px)/1.2 Georgia, serif;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .certificate p {
            margin: 10px 0;
            color: #655a87;
            font-size: 13px;
        }

        .certificate-name {
            margin: 18px 0 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #a993cc;
            color: #55468d;
            font: italic 700 clamp(28px, 6vw, 48px)/1.1 Georgia, serif;
        }

        .certificate-badge {
            display: inline-block;
            margin: 22px 0 10px;
            padding: 10px 22px;
            border: 1px solid #d6b86b;
            border-radius: 99px;
            color: #68579a;
            background: #fff8df;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .certificate-meta {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 22px;
            color: #766995;
            font-size: 11px;
        }

        @media (max-width: 560px) {
            .quiz-level-menu {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <nav class="navbar" aria-label="Primary navigation">
            <a class="brand" href="index.html" aria-label="Edunova home"><span class="brand-mark"
                    aria-hidden="true"><span></span><span></span><span></span></span><span>Edunova</span></a>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu"
                aria-label="Open navigation menu"><span></span><span></span><span></span></button>
            <div class="nav-menu" id="main-menu">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="learn.html">Algorithms</a>
                <a class="nav-link active" href="quiz.html" aria-current="page">Quiz</a>
                <a class="nav-link" href="tutor.html">AI Tutor</a>
                <a class="profile-link" href="profile.html"><span class="profile-avatar"
                        aria-hidden="true">A</span><span>Profile</span></a>
            </div>
        </nav>
    </header>
    <main class="page-width quiz-page">
        <p class="eyebrow">Test your intuition</p>
        <h1>Quantum <em>quiz.</em></h1>
        <p class="hero-copy">Check what you know about quantum algorithms.</p>
        <div class="quiz-level-menu" aria-label="Quiz levels">
                <button class="quiz-level-card current" type="button" data-level="0"><strong>Easy</strong><span>Algorithms 1-7</span></button>
                <button class="quiz-level-card" type="button" data-level="1" disabled><strong>Medium</strong><span>Algorithms 8-14</span></button>
                <button class="quiz-level-card" type="button" data-level="2" disabled><strong>Hard</strong><span>Algorithms 15-20</span></button>
        </div>
        <section class="quiz-card" id="quiz-card" aria-labelledby="quiz-question" hidden>
            <div class="quiz-progress"><span id="quiz-level-label">Level 1 of 3</span><span id="quiz-score">Score:
                    0</span></div>
            <div class="quiz-levels" aria-label="Quiz level progress"><span class="quiz-level active"></span><span
                    class="quiz-level"></span><span class="quiz-level"></span></div>
            <p class="quiz-progress" id="quiz-count">Question 1 of 7</p>
            <h2 class="quiz-question" id="quiz-question"></h2>
            <div class="quiz-options" id="quiz-options"></div>
            <p class="quiz-feedback" id="quiz-feedback" aria-live="polite"></p>
            <div class="quiz-actions"><button id="quiz-next" type="button" disabled>Next question &#8594;</button></div>
        </section>
    </main>
    <script src="script.js"></script>
    <script>
        const levels = [
            [
                { question: 'What does Deutsch’s Algorithm determine?', options: ['Whether a function is constant or balanced', 'The factors of a large number', 'A molecular ground-state energy', 'A hidden period'], answer: 0 },
                { question: 'What promise does the Deutsch-Jozsa Algorithm use?', options: ['The function is constant or balanced', 'The answer is already sorted', 'The circuit has no gates', 'The number is prime'], answer: 0 },
                { question: 'What does the Bernstein-Vazirani Algorithm find?', options: ['A hidden binary string', 'A molecular energy', 'A Fourier frequency', 'A graph route'], answer: 0 },
                { question: 'What hidden property does Simon’s Algorithm find?', options: ['A secret XOR period', 'A shortest path', 'A phase angle only', 'A constant function'], answer: 0 },
                { question: 'What type of problem does Grover’s Algorithm speed up?', options: ['Unstructured search', 'Integer factoring', 'Molecular simulation', 'Phase estimation'], answer: 0 },
                { question: 'What does the Quantum Fourier Transform reveal?', options: ['Periodic structure', 'A password', 'A molecular bond', 'A graph coloring'], answer: 0 },
                { question: 'What problem is Shor’s Algorithm designed to solve efficiently?', options: ['Integer factoring', 'Unstructured search', 'Function classification', 'Circuit drawing'], answer: 0 }
            ],
            [
                { question: 'What does Quantum Phase Estimation estimate?', options: ['The phase of a unitary operator', 'The size of a database', 'The number of qubits in a chip', 'The depth of a graph'], answer: 0 },
                { question: 'What does VQE estimate?', options: ['A molecular ground-state energy', 'A hidden binary string', 'A search index', 'A function period'], answer: 0 },
                { question: 'What kind of problem does QAOA target?', options: ['Combinatorial optimization', 'Integer factoring only', 'Constant-function testing', 'Voice transcription'], answer: 0 },
                { question: 'What does the HHL Algorithm help estimate?', options: ['Solutions to certain linear systems', 'The number of marked database items', 'A function’s balance', 'A graph’s shortest walk'], answer: 0 },
                { question: 'What does a Quantum Walk Algorithm use to explore graphs?', options: ['Quantum interference across paths', 'Classical sorting only', 'Molecular energy measurements', 'RSA key generation'], answer: 0 },
                { question: 'What does Amplitude Estimation measure?', options: ['A probability encoded in an amplitude', 'The size of a circuit board', 'A hidden binary string', 'The depth of a graph'], answer: 0 },
                { question: 'What does Quantum Counting estimate?', options: ['The number of marked solutions', 'The phase of every gate', 'The energy of a molecule', 'The length of a password'], answer: 0 }
            ],
            [
                { question: 'What is the main benefit of Iterative Phase Estimation?', options: ['It uses a smaller phase register', 'It removes all measurements', 'It factors numbers directly', 'It needs no quantum gates'], answer: 0 },
                { question: 'What does Amplitude Amplification do?', options: ['Increases the probability of desired states', 'Counts every database item classically', 'Finds molecular ground states only', 'Removes an oracle from search'], answer: 0 },
                { question: 'What does Quantum Signal Processing transform?', options: ['Eigenvalue information using phase sequences', 'Classical passwords into keys', 'Graphs into databases', 'Measurements into qubits'], answer: 0 },
                { question: 'What does QSVT apply to singular values?', options: ['Polynomial transformations', 'Classical encryption', 'Random measurements', 'Graph labels'], answer: 0 },
                { question: 'What is Quantum k-Means used for?', options: ['Grouping data into clusters', 'Factoring integers', 'Finding a hidden period', 'Estimating a unitary phase'], answer: 0 },
                { question: 'What does a Quantum Support Vector Machine classify with?', options: ['Quantum feature maps and kernels', 'A period-finding oracle', 'A Fourier-only register', 'A molecular Hamiltonian only'], answer: 0 }
            ]
        ];
        let levelIndex = 0;
        let questionIndex = 0;
        let score = 0;
        let levelScore = 0;
        let answered = false;
        const questionTitle = document.querySelector('#quiz-question');
        const optionsElement = document.querySelector('#quiz-options');
        const feedback = document.querySelector('#quiz-feedback');
        const nextButton = document.querySelector('#quiz-next');
        const scoreElement = document.querySelector('#quiz-score');
        const countElement = document.querySelector('#quiz-count');
        const levelLabel = document.querySelector('#quiz-level-label');
        const levelIndicators = document.querySelectorAll('.quiz-level');
        const levelButtons = document.querySelectorAll('.quiz-level-card');
        const quizCard = document.querySelector('#quiz-card');

        function startLevel(nextLevel) {
            levelIndex = nextLevel;
            questionIndex = 0;
            levelScore = 0;
            quizCard.hidden = false;
            levelButtons.forEach((button, index) => button.classList.toggle('current', index === levelIndex));
            renderQuestion();
            quizCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function renderQuestion() {
            const questions = levels[levelIndex];
            const current = questions[questionIndex];
            answered = false;
            questionTitle.textContent = current.question;
            countElement.textContent = 'Question ' + (questionIndex + 1) + ' of ' + questions.length;
            levelLabel.textContent = 'Level ' + (levelIndex + 1) + ' of ' + levels.length;
            levelIndicators.forEach((indicator, index) => indicator.classList.toggle('active', index === levelIndex));
            feedback.textContent = '';
            nextButton.disabled = true;
            nextButton.textContent = questionIndex === questions.length - 1 ? 'See result' : 'Next question →';
            optionsElement.replaceChildren(...current.options.map((option, index) => {
                const button = document.createElement('button');
                button.className = 'quiz-option';
                button.type = 'button';
                button.textContent = option;
                button.addEventListener('click', () => selectAnswer(index));
                return button;
            }));
        }

        function selectAnswer(selectedIndex) {
            if (answered) return;
            answered = true;
            const current = levels[levelIndex][questionIndex];
            const options = optionsElement.querySelectorAll('.quiz-option');
            options.forEach((option, index) => {
                option.disabled = true;
                if (index === current.answer) option.classList.add('correct');
                if (index === selectedIndex && index !== current.answer) option.classList.add('incorrect');
            });
            if (selectedIndex === current.answer) {
                score += 1;
                levelScore += 1;
                feedback.textContent = 'Correct. Nice work.';
            } else {
                feedback.textContent = 'Not quite. The highlighted answer is correct.';
            }
            scoreElement.textContent = 'Score: ' + score;
            nextButton.disabled = false;
        }

        nextButton.addEventListener('click', () => {
            if (!answered) return;
            if (questionIndex === levels[levelIndex].length - 1) {
                levelIndicators[levelIndex].classList.add('complete');
                if (levelIndex < levels.length - 1) {
                    levelButtons[levelIndex + 1].disabled = false;
                    nextButton.disabled = true;
                    feedback.textContent = 'Level ' + (levelIndex + 1) + ' complete. Loading Level ' + (levelIndex + 2) + '...';
                    window.setTimeout(() => {
                        startLevel(levelIndex + 1);
                    }, 900);
                    return;
                }
                const totalQuestions = levels.reduce((total, level) => total + level.length, 0);
                const currentUser = JSON.parse(localStorage.getItem('edunovaCurrentUser') || sessionStorage.getItem('edunovaCurrentUser') || 'null');
                const learnerName = currentUser && currentUser.name ? currentUser.name : 'Edunova Learner';
                const completionDate = new Intl.DateTimeFormat('en', { dateStyle: 'long' }).format(new Date());
                const certificateId = 'EDU-' + Date.now().toString(36).toUpperCase();
                document.querySelector('.quiz-card').innerHTML = '<div class="certificate"><p class="certificate-kicker">Edunova Learning Space</p><h2>Certificate</h2><p class="certificate-subtitle">of Achievement</p><p>This certificate is proudly presented to</p><div class="certificate-name">' + learnerName + '</div><p>for successfully completing all 3 levels of the Quantum Algorithms Quiz.</p><div class="certificate-badge">20 ALGORITHMS COMPLETED</div><p>You scored ' + score + ' out of ' + totalQuestions + ' questions.</p><div class="certificate-meta"><span>Date: ' + completionDate + '</span><span>Certificate ID: ' + certificateId + '</span></div></div><div class="quiz-actions"><button id="quiz-retry" type="button">Try again</button></div>';
                document.querySelector('#quiz-retry').addEventListener('click', () => window.location.reload());
                return;
            }
            questionIndex += 1;
            renderQuestion();
        });

        levelButtons.forEach((button) => button.addEventListener('click', () => {
            const selectedLevel = Number(button.dataset.level);
            if (!button.disabled) startLevel(selectedLevel);
        }));
    </script>
</body>

</html>
