<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin sign in | Edunova</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #19222b;
            --muted: #6d7981;
            --line: #dce5e5;
            --paper: #f7faf7;
            --panel: #ffffff;
            --accent: #e36b4d;
            --teal: #1f7773;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: radial-gradient(circle at 15% 15%, #e2f1e9 0, transparent 34%), linear-gradient(135deg, #f7faf7, #edf4f0);
            font: 16px/1.5 "Trebuchet MS", sans-serif;
        }

        .shell {
            width: min(100%, 980px);
            display: grid;
            grid-template-columns: 1fr 0.9fr;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: 0 24px 70px rgba(38, 61, 57, .14);
        }

        .intro {
            padding: clamp(32px, 7vw, 76px);
            background: var(--teal);
            color: #fff;
            position: relative;
            isolation: isolate;
        }

        .intro::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            right: -90px;
            bottom: -100px;
            border: 1px solid rgba(255, 255, 255, .28);
            border-radius: 50%;
            box-shadow: 0 0 0 28px rgba(255, 255, 255, .08), 0 0 0 58px rgba(255, 255, 255, .05);
            z-index: -1;
        }

        .mark {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font: 700 1.15rem/1 "Trebuchet MS", sans-serif;
            letter-spacing: .04em;
        }

        .mark-dot {
            width: 28px;
            height: 28px;
            display: inline-block;
            border: 3px solid #f7c96d;
            border-radius: 50%;
            position: relative;
        }

        .mark-dot::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 7px;
            top: 7px;
            left: 7px;
            background: #f7c96d;
            border-radius: 50%;
        }

        .intro h1 {
            max-width: 390px;
            margin: 88px 0 16px;
            font: 700 clamp(2.4rem, 6vw, 4.5rem)/.98 Georgia, serif;
            letter-spacing: -.04em;
        }

        .intro p {
            max-width: 360px;
            margin: 0;
            color: #d8eeea;
        }

        .panel {
            padding: clamp(30px, 6vw, 68px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
        }

        h2 {
            margin: 0 0 8px;
            font: 700 2rem/1.05 Georgia, serif;
        }

        .subcopy {
            margin: 0 0 30px;
            color: var(--muted);
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-size: .85rem;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--line);
            border-radius: 8px;
            color: var(--ink);
            background: #fbfdfb;
            font: inherit;
        }

        input:focus {
            outline: 3px solid rgba(227, 107, 77, .2);
            border-color: var(--accent);
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            background: var(--accent);
            cursor: pointer;
            font: 700 1rem inherit;
        }

        button:hover {
            background: #c95339;
        }

        .status {
            min-height: 24px;
            margin: 14px 0 0;
            color: #b33c2b;
            font-size: .88rem;
        }

        .status.success {
            color: var(--teal);
        }

        .back {
            display: inline-block;
            margin-top: 24px;
            color: var(--muted);
            font-size: .85rem;
            text-decoration: none;
        }

        .back:hover {
            color: var(--accent);
        }

        @media (max-width: 700px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .intro {
                padding: 32px;
            }

            .intro h1 {
                margin-top: 54px;
            }

            .panel {
                padding: 32px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <section class="intro" aria-label="Admin area introduction">
            <div class="mark"><span class="mark-dot" aria-hidden="true"></span> EDUNOVA / ADMIN</div>
            <h1>Keep the learning lab moving.</h1>
            <p>A private workspace for managing the Edunova learning community.</p>
        </section>
        <section class="panel" aria-labelledby="admin-login-title">
            <p class="eyebrow">Restricted access</p>
            <h2 id="admin-login-title">Admin sign in</h2>
            <p class="subcopy">Use the administrator account to continue.</p>
            <form id="admin-login-form" novalidate>
                <label for="admin-email">Email address</label>
                <input id="admin-email" type="email" autocomplete="username" required>
                <label for="admin-password">Password</label>
                <input id="admin-password" type="password" autocomplete="current-password" required>
                <button type="submit">Enter admin workspace</button>
                <p class="status" id="admin-status" role="status" aria-live="polite"></p>
            </form>
            <a class="back" href="index.html">Return to learner site</a>
        </section>
    </main>
    <script>
        const adminForm = document.querySelector('#admin-login-form');
        const adminStatus = document.querySelector('#admin-status');

        adminForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            adminStatus.className = 'status';
            adminStatus.textContent = '';
            const email = document.querySelector('#admin-email').value.trim().toLowerCase();
            const password = document.querySelector('#admin-password').value;
            if (!email || !password) {
                adminStatus.textContent = 'Enter both administrator credentials.';
                return;
            }
            try {
                const response = await fetch('admin.json', { cache: 'no-store' });
                const data = await response.json();
                const admin = Array.isArray(data.admins) ? data.admins.find((account) => account.name.toLowerCase() === 'admin') : null;
                if (!admin || admin.email.toLowerCase() !== email || admin.password !== password) {
                    adminStatus.textContent = 'Administrator credentials are incorrect.';
                    return;
                }
                sessionStorage.setItem('edunovaAdminSession', JSON.stringify({ name: admin.name, email: admin.email }));
                adminStatus.className = 'status success';
                adminStatus.textContent = 'Access granted. Opening workspace...';
                window.setTimeout(() => window.location.replace('admin.html'), 350);
            } catch (error) {
                adminStatus.textContent = 'Could not verify the administrator account.';
            }
        });
    </script>
</body>

</html>
